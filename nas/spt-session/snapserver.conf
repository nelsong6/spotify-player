[server]
# remembers each PC and whether it's muted
datadir = /data
mdns_enabled = false

[http]
enabled = false

[tcp-control]
# only the session, in this container, reads the client list
bind_to_address = 127.0.0.1

[tcp-streaming]
bind_to_address = 0.0.0.0

[stream]
# two slots of the session (run.sh), so a new release takes over between songs; Home plays
# whichever slot is playing. pcm: the PCs decode nothing; stereo 44.1 kHz is 1.4 Mbit/s per PC.
source = process:///run.sh?name=slot-a&params=a&sampleformat=44100:16:2&codec=pcm&log_stderr=true
source = process:///run.sh?name=slot-b&params=b&sampleformat=44100:16:2&codec=pcm&log_stderr=true
source = meta:///slot-a/slot-b?name=Home&sampleformat=44100:16:2&codec=pcm
default_source = Home
buffer = 600
# a muted PC still gets the audio to draw the visualization from
send_to_muted = true

[logging]
sink = stdout
