# CI's pin PRs (pipeline-templates' release suite) move these: the image (Snapcast, run.sh,
# stager.sh) by the release that built it and its digest, and the spt release the stager
# stages. A release whose k8s/image is unchanged keeps the image, so it reaches the running
# pod without restarting it; a new image restarts it.
