# From OpenBao secret/services/spt-session: a Forgejo token that reads this repository's
# releases (the stager's downloads) and its registry (the image), nothing else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: release-read
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: release-read
  data:
    - secretKey: release-read-token
      remoteRef:
        key: services/spt-session
        property: release-read-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: forgejo-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forgejo.romaine.life":{"username":"nelson","password":"{{ "{{" }} .token {{ "}}" }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: services/spt-session
        property: registry-read-token
