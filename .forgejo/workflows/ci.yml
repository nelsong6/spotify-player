name: CI

# Every pull request runs the checks and both builds; a push to master runs the same and,
# when all of it passed, releases the builds as a Forgejo release named by `git describe`.
# The release triggers the PCs; the home cluster's session takes it through the pin PR
# (`pin`), which a push to master proposes when it makes a release or a new image. The
# session's chart and image (k8s/) are checked on every change.

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FEATURES: "streaming,cast,media-control,image,notify,fzf"

jobs:
  # Whether a change touches more than k8s/: a change to the session's chart or image alone
  # builds no spt and makes no release, so the pin PRs CI proposes don't release again. A push
  # compares with the last release, so a release that failed is made by the next push.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - id: diff
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF")
          else
            base=$(git describe --tags --abbrev=0 --match 'v*-g*' HEAD 2>/dev/null || true)
          fi
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- . ':(exclude)k8s'; then
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo "only k8s/ changed since $base"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  # Exercise tag writes on PRs too: Forgejo's tag API returned 500 from a release job.
  tag-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag publishing
        run: |
          $probe = "FORGEJO-3-ci-g$([guid]::NewGuid().ToString('N'))"
          $created = $false
          try {
            git push origin "$($env:GITHUB_SHA):refs/tags/$probe"
            if ($LASTEXITCODE) { throw 'creating the temporary tag failed' }
            $created = $true
            $ref = git ls-remote origin "refs/tags/$probe"
            if ($LASTEXITCODE -or ($ref -split '\s+')[0] -ne $env:GITHUB_SHA) { throw 'temporary tag verification failed' }
          } finally {
            if ($created) {
              git push origin ":refs/tags/$probe"
              if ($LASTEXITCODE) { throw "removing temporary tag $probe failed" }
            }
          }

  # ubuntu-latest jobs run one at a time on the runner `nas` (on the home cluster), so the
  # only Rust job there is the session's build; every check and release runs on upstairspc.
  #
  # windows-latest is upstairspc in host mode: `bash` there is WSL's launcher, so every step
  # is pwsh, and without the runner user's profile. The runner names a custom shell's script
  # without .ps1, which pwsh won't run as a file, so the shell reads it in. No
  # Swatinem/rust-cache there: its cleanup empties ~/.cargo/bin, which on a host runner is
  # the runner user's own rustup install.
  rust-ci-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy rustfmt --toolchain stable

      # typos at the version crate-ci/typos@master ran on GitHub; both stay installed in the
      # runner user's ~/.cargo/bin, so this only builds them once. They run before the build,
      # with no target directory to walk.
      - name: Install typos and cargo-machete
        run: cargo install --locked typos-cli@1.50.2 cargo-machete

      - name: Typos
        run: typos

      - name: Cargo machete
        run: cargo machete

      - name: Cargo format
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --no-default-features --features $env:RUST_FEATURES

      - name: Cargo clippy with all features
        run: cargo clippy --no-default-features --features $env:RUST_FEATURES -- -D warnings

      - name: Cargo clippy without features
        run: cargo clippy --no-default-features -- -D warnings

  # the build publish.ps1 publishes, made alongside the checks; it is released only from a
  # master run whose checks all passed
  windows-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      # the tags, for the same `git describe` the release is named by
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: romaine-life/pipeline-templates/actions/home-cache@main

      - name: Install Rust toolchain
        run: rustup update stable --no-self-update

      # The info panel's stamps; GITHUB_REPOSITORY and GITHUB_SERVER_URL are read as they are.
      - name: Build
        run: |
          $env:SPT_BUILD_VERSION = git describe --tags --always --abbrev=7 --exclude '*-g*'
          if ($LASTEXITCODE -or -not $env:SPT_BUILD_VERSION) { throw 'git describe gave no version' }
          $env:SPT_BUILD_TIME = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          foreach ($stamp in 'GITHUB_REPOSITORY', 'GITHUB_SERVER_URL') {
            if (-not [Environment]::GetEnvironmentVariable($stamp)) { throw "$stamp is not set" }
          }
          Write-Host "stamping $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY $env:SPT_BUILD_VERSION built $env:SPT_BUILD_TIME"
          cargo build --locked --release

      # the command palette loads fzt.dll from beside the executable; fzt.lock pins its
      # release, including its original checksum, now available on Forgejo.
      - name: Fetch fzt
        env:
          FZT_TOKEN: ${{ secrets.FZT_RELEASE_TOKEN }}
        run: |
          $tag, $sha256 = (Get-Content fzt.lock -Raw).Trim() -split '\s+'
          if (-not $env:FZT_TOKEN) { throw 'FZT_RELEASE_TOKEN is not set' }
          Invoke-WebRequest "https://forgejo.romaine.life/romaine-life/fzt-terminal/releases/download/$tag/fzt-windows-amd64.dll" -Headers @{ Authorization = "token $env:FZT_TOKEN" } -OutFile target/release/fzt.dll
          $got = (Get-FileHash target/release/fzt.dll -Algorithm SHA256).Hash
          if ($got -ne $sha256) { throw "fzt.dll $tag has sha256 $got, fzt.lock pins $sha256" }

      # Defender quarantined an unsigned tmux build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts. fzt.dll is signed here, after its
      # checksum, because this is the CI that publishes it.
      - name: Sign
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD target/release/spotify_player.exe target/release/fzt.dll
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item cert.pfx }

      # actions/upload-artifact@v4 doesn't work against Forgejo; this is Forgejo's fork of it.
      - uses: forgejo/upload-artifact@v4
        with:
          name: spotify_player-windows
          path: |
            target/release/spotify_player.exe
            target/release/fzt.dll
          if-no-files-found: error

  linux-build:
    # the session for the home cluster: its audio goes to stdout, so no audio libraries to
    # build against. Its glibc (ubuntu 24.04's) must not outrun the image's Debian (k8s/image).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main

      - name: Install dependencies
        run: apt-get update && apt-get install -y pkg-config libssl-dev

      - name: Install Rust toolchain
        run: |
          curl -fsSL -o /tmp/rustup-init https://artifacts.home.romaine.life/general/rust/rustup/dist/x86_64-unknown-linux-gnu/rustup-init
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain stable
          rm /tmp/rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: nice -n 19 cargo build --locked --release --no-default-features --features rustls-tls,streaming

      # the repository's files compiled into the session, from Cargo's dependency file:
      # publish.ps1 moves the session to a release only when one of them changed
      - name: List the session's sources
        run: >-
          tr ' ' '\n' < target/release/spotify_player.d | grep "^$GITHUB_WORKSPACE/"
          | xargs realpath -m --relative-to="$GITHUB_WORKSPACE" | grep -v '^target/' | sort -u
          > target/release/session-sources.txt

      - uses: forgejo/upload-artifact@v4
        with:
          name: spotify_player-linux
          path: |
            target/release/spotify_player
            target/release/session-sources.txt
          if-no-files-found: error

  # The release is the master commit's `git describe`, e.g. v0.25.1-102-gabcdef1; release
  # tags are excluded from the describe so the next one counts from upstream's tag.
  # PRs also assemble and validate the release, without publishing it.
  release:
    needs: [tag-check, rust-ci-windows, windows-build, linux-build]
    outputs:
      release-tag: ${{ steps.release.outputs.tag || 'validation-only' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: forgejo/download-artifact@v4
        with:
          name: spotify_player-windows
          path: dist

      - uses: forgejo/download-artifact@v4
        with:
          name: spotify_player-linux
          path: dist

      - name: Validate release assets
        run: |
          foreach ($name in 'spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt') {
            if (-not (Get-Item "dist/$name").Length) { throw "empty release asset: $name" }
          }
          foreach ($name in 'spotify_player.exe', 'fzt.dll') {
            $sig = Get-AuthenticodeSignature "dist/$name"
            if ($sig.Status -ne 'Valid') { throw "invalid signature on $name`: $($sig.Status)" }
          }
          $sources = @(Get-Content dist/session-sources.txt)
          if ('spotify_player/src/main.rs' -notin $sources) { throw 'session source list omits main.rs' }
          foreach ($source in $sources) {
            if ($source.StartsWith('/') -or $source.Contains('..') -or -not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "invalid session source: $source"
            }
          }
          git describe --tags --always --abbrev=7 --exclude '*-g*'
          $tag = git describe --tags --always --abbrev=7 --exclude '*-g*'
          # the info panel must name the release it ships in
          $exe = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes("$PWD/dist/spotify_player.exe"))
          foreach ($stamp in $tag, $env:GITHUB_REPOSITORY, $env:GITHUB_SERVER_URL) {
            if (-not $exe.Contains($stamp)) { throw "spotify_player.exe is not stamped with $stamp" }
          }
          $files = @{}
          foreach ($name in 'spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt') {
            $files[$name] = @{ size = (Get-Item "dist/$name").Length; sha256 = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          @{ tag = $tag; commit = $env:GITHUB_SHA; files = $files } | ConvertTo-Json -Depth 4 | Set-Content dist/session-release.json -Encoding utf8NoBOM

      - name: Release
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = git describe --tags --always --abbrev=7 --exclude '*-g*'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "token $env:TOKEN" }
          # Publishing a draft does not create its Git ref on Forgejo. Git pushes use
          # checkout's persisted job credential, verified by tag-check on every PR.
          $ref = git ls-remote origin "refs/tags/$tag"
          if ($LASTEXITCODE) { throw "tag lookup for $tag failed" }
          if (-not $ref) {
            git push origin "$($env:GITHUB_SHA):refs/tags/$tag"
            if ($LASTEXITCODE) { throw "creating tag $tag failed" }
            $ref = git ls-remote origin "refs/tags/$tag"
            if ($LASTEXITCODE) { throw "tag verification for $tag failed" }
          }
          if (($ref -split '\s+')[0] -ne $env:GITHUB_SHA) { throw "tag $tag points to a different commit" }
          $release = Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 200 -and -not $release.draft) {
            $missing = @('spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt', 'session-release.json' | Where-Object { $_ -notin $release.assets.name })
            if ($missing.Count) { throw "published release $tag is incomplete" }
            Write-Host "$tag already released"
            "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
            exit 0
          }
          if ($code -eq 404) {
            $body = @{ tag_name = $tag; target_commitish = $env:GITHUB_SHA; name = $tag; body = "Built from $env:GITHUB_SHA."; draft = $true } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post "$api/releases" -Headers $headers -ContentType 'application/json' -Body $body
          } elseif ($code -ne 200) { throw "release lookup for $tag returned $code" }
          foreach ($name in 'spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt', 'session-release.json') {
            if ($name -notin $release.assets.name) {
              Invoke-RestMethod -Method Post "$api/releases/$($release.id)/assets?name=$name" -Headers $headers -Form @{ attachment = Get-Item "dist/$name" } | Out-Null
            }
          }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "released $tag"

  home-sync:
    needs: release
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.release.outputs.release-tag != 'validation-only' && needs.release.outputs.release-tag || '' }}

  # The session's image on the home cluster (k8s/image): Snapcast, run.sh and the stager. It is
  # named by the last commit to k8s/image, so it's built again only when that changes, and
  # pushed from master when values.yaml doesn't pin it yet.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    enable-openid-connect: true
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          set -eu
          tag=$(git log -1 --format=%h --abbrev=7 -- k8s/image)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if grep -qx "image: forgejo.romaine.life/nelsong6/spt-session:$tag" k8s/values.yaml; then
            echo 'pinned=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pinned=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: docker build --network host -t "spt-session:check-$GITHUB_SHA" k8s/image
      - name: Check the image's programs
        run: |
          set -eu
          docker run --rm --entrypoint snapserver "spt-session:check-$GITHUB_SHA" --version
          docker run --rm --entrypoint sh "spt-session:check-$GITHUB_SHA" -c \
            'for p in bash jq curl inotifywait sqlite3 sha256sum; do command -v "$p"; done; bash -n /stager.sh; sh -n /run.sh'
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.tag.outputs.pinned == 'false'
        env:
          IMAGE: forgejo.romaine.life/nelsong6/spt-session:${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/spt-registry"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          jwt=$(printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" | curl -sS --fail-with-body -K - "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openbao" | jq -er .value)
          echo "::add-mask::$jwt"
          # OpenBao's refusals are printed (never its answers, which hold tokens) with the
          # job identity's claims it checks, so a refused sign-in says why.
          bao_call() {
            out=$(curl -sS -w '\n%{http_code}' "$@")
            code=${out##*$'\n'}; body=${out%$'\n'*}
            if [ "$code" != 200 ]; then
              echo "OpenBao answered $code: $(printf '%s' "$body" | jq -c .errors 2>/dev/null || printf '%s' "$body")" >&2
              printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+' | jq -R '@base64d | fromjson | {sub, repository, ref, workflow, event_name, aud}' >&2 || true
              return 1
            fi
            printf '%s' "$body"
          }
          bao=$(printf '%s' "$jwt" | jq -Rs '{role:"spotify-player-publish",jwt:.}' | bao_call -H 'Content-Type: application/json' --data-binary @- https://bao.home.romaine.life/v1/auth/forgejo/login | jq -er .auth.client_token)
          echo "::add-mask::$bao"
          registry=$(printf 'header = "X-Vault-Token: %s"\n' "$bao" | bao_call -K - https://bao.home.romaine.life/v1/secret/data/services/spt-session-build | jq -er '.data.data["registry-token"]')
          echo "::add-mask::$registry"
          printf '%s' "$registry" | docker login forgejo.romaine.life --username nelson --password-stdin
          docker tag "spt-session:check-$GITHUB_SHA" "$IMAGE"
          docker push "$IMAGE"

  # The home cluster runs what k8s/values.yaml pins, so a new release or image reaches it
  # through this PR, merged once its checks pass (auth's pattern, romaine-life/auth). It never
  # pins an older release than master's, and replaces any pin PR still open.
  pin:
    needs: [release, image]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
      && needs.image.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The pin is pushed with PIPELINE_DISPATCH_TOKEN, as auth's is.
          persist-credentials: false
      - name: Propose the pin
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          RELEASE: ${{ needs.release.outputs.release-tag }}
          IMAGE: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth() { printf 'Authorization: token %s\n' "$TOKEN"; }
          git checkout -q -B pin origin/master
          pinned=$(sed -n 's/^  commit: //p' k8s/values.yaml)
          if [ -n "$RELEASE" ] && [ "$RELEASE" != validation-only ]; then
            if git merge-base --is-ancestor "$pinned" "$GITHUB_SHA"; then
              sed -i -E "s/^  tag: .*/  tag: $RELEASE/; s/^  commit: .*/  commit: $GITHUB_SHA/" k8s/values.yaml
            else
              echo "master pins $pinned, which $GITHUB_SHA doesn't follow; not pinning $RELEASE"
            fi
          fi
          sed -i -E "s|^image: forgejo.romaine.life/nelsong6/spt-session:.*|image: forgejo.romaine.life/nelsong6/spt-session:$IMAGE|" k8s/values.yaml
          git add k8s/values.yaml
          if git diff --cached --quiet; then echo 'master already pins this'; exit 0; fi
          what=$(git diff --cached -U0 | sed -n -E 's/^\+ *((image|tag): .*)$/\1/p' | paste -sd, - | sed 's/,/, /g')
          branch="SPT-35-pin-${GITHUB_SHA:0:7}"
          git config user.name forgejo-actions
          git config user.email forgejo-actions@noreply.romaine.life
          git commit -q -m "chore: pin spt-session $what"
          # Keep the credential out of git's process arguments.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git push -q origin "HEAD:refs/heads/$branch"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          for old in $(auth | curl -fsS --header @- "$api/pulls?state=open&limit=50" | jq -r --arg b "$branch" '.[] | select(.head.ref | startswith("SPT-35-pin-")) | select(.head.ref != $b) | .number'); do
            auth | curl -fsS -o /dev/null --header @- -X PATCH -H 'Content-Type: application/json' -d '{"state":"closed"}' "$api/pulls/$old"
            echo "closed pin PR $old"
          done
          body=$(jq -n --arg head "$branch" --arg what "$what" '{base:"master",head:$head,title:("chore: pin spt-session "+$what),body:"The spt-session pin for the home cluster, proposed by CI. https://openproject.romaine.life/wp/SPT-35"}')
          number=$(auth | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d "$body" "$api/pulls" | jq -er .number)
          auth | curl --fail-with-body -sS -X POST --header @- -H 'Content-Type: application/json' -d '{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}' "$api/pulls/$number/merge"
          echo "pin PR $number: $what"

  # The chart as it ships and as the takeover sets it, against the cluster's schemas.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - name: Check the home cluster's manifests
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
          curl -fsSL https://artifacts.home.romaine.life/general/helm-downloads/helm-v3.22.1-linux-amd64.tar.gz | tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -fsSL https://artifacts.home.romaine.life/general/github/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          shellcheck k8s/image/*.sh
          # The takeover's values, with an image in place of the one CI pins
          sed -E 's/^( *[^:#]+): [^#]*# takeover: (.*)$/\1: \2/; s/:unpinned$/:0000000/' k8s/values.yaml > /tmp/takeover.yaml
          if grep -nE '^ *[^ #][^#]*# takeover:' /tmp/takeover.yaml; then echo "a takeover: line above wasn't applied"; exit 1; fi
          for values in k8s/values.yaml /tmp/takeover.yaml; do
            echo "== $values"
            helm template spt-session k8s --namespace spt -f "$values" |
              kubeconform -strict -summary -schema-location 'https://artifacts.home.romaine.life/general/githubusercontent/yannh/kubernetes-json-schema/master/{{.NormalizedKubernetesVersion}}-standalone{{.StrictSuffix}}/{{.ResourceKind}}{{.KindSuffix}}.json' \
                -schema-location 'https://artifacts.home.romaine.life/general/githubusercontent/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
