name: CI

# Every pull request runs the checks and both builds; a push to master runs the same and,
# when all of it passed, releases the builds as a Forgejo release named by `git describe`.
# publish.ps1 publishes that release.

on:
  pull_request:
  push:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FEATURES: "streaming,cast,media-control,image,notify,fzf"

jobs:
  # The NAS runs ubuntu-latest jobs one at a time beside the spt session, on a 4-core
  # Celeron, so the only Linux job is the session's build; every check and release runs
  # on upstairspc.
  #
  # windows-latest is upstairspc in host mode: `bash` there is WSL's launcher, so every step
  # is pwsh, and without the runner user's profile. The runner names a custom shell's script
  # without .ps1, which pwsh won't run as a file, so the shell reads it in. No
  # Swatinem/rust-cache there: its cleanup empties ~/.cargo/bin, which on a host runner is
  # the runner user's own rustup install.
  rust-ci-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup component add clippy rustfmt --toolchain stable

      # typos at the version crate-ci/typos@master ran on GitHub; both stay installed in the
      # runner user's ~/.cargo/bin, so this only builds them once. They run before the build,
      # with no target directory to walk.
      - name: Install typos and cargo-machete
        run: cargo install --locked typos-cli@1.50.2 cargo-machete

      - name: Typos
        run: typos

      - name: Cargo machete
        run: cargo machete

      - name: Cargo format
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --no-default-features --features $env:RUST_FEATURES

      - name: Cargo clippy with all features
        run: cargo clippy --no-default-features --features $env:RUST_FEATURES -- -D warnings

      - name: Cargo clippy without features
        run: cargo clippy --no-default-features -- -D warnings

  # the build publish.ps1 publishes, made alongside the checks; it is released only from a
  # master run whose checks all passed
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup update stable --no-self-update

      - name: Build
        run: cargo build --locked --release

      # the command palette loads fzt.dll from beside the executable; fzt.lock pins its
      # release, including its original checksum, now available on Forgejo.
      - name: Fetch fzt
        env:
          FZT_TOKEN: ${{ secrets.FZT_RELEASE_TOKEN }}
        run: |
          $tag, $sha256 = (Get-Content fzt.lock -Raw).Trim() -split '\s+'
          if (-not $env:FZT_TOKEN) { throw 'FZT_RELEASE_TOKEN is not set' }
          Invoke-WebRequest "https://forgejo.romaine.life/romaine-life/fzt-terminal/releases/download/$tag/fzt-windows-amd64.dll" -Headers @{ Authorization = "token $env:FZT_TOKEN" } -OutFile target/release/fzt.dll
          $got = (Get-FileHash target/release/fzt.dll -Algorithm SHA256).Hash
          if ($got -ne $sha256) { throw "fzt.dll $tag has sha256 $got, fzt.lock pins $sha256" }

      # Defender quarantined an unsigned tmux build as Program:Win32/Contebrew.A!ml
      # and passed the same build signed (TMUX-30). The certificate is at
      # Terminal's, which every home PC trusts. fzt.dll is signed here, after its
      # checksum, because this is the CI that publishes it.
      - name: Sign
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX) { throw 'AT_TERMINAL_PFX is not set' }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD target/release/spotify_player.exe target/release/fzt.dll
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item cert.pfx }

      # actions/upload-artifact@v4 doesn't work against Forgejo; this is Forgejo's fork of it.
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: spotify_player-windows
          path: |
            target/release/spotify_player.exe
            target/release/fzt.dll
          if-no-files-found: error

  linux-build:
    # the session for the NAS: its audio goes to stdout, so no audio libraries to build
    # against. Its glibc (ubuntu 24.04's) must not outrun the NAS container's Debian.
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y pkg-config libssl-dev

      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: Build
        run: nice -n 19 cargo build --locked --release --no-default-features --features rustls-tls,streaming

      # the repository's files compiled into the session, from Cargo's dependency file:
      # publish.ps1 moves the session to a release only when one of them changed
      - name: List the session's sources
        run: >-
          tr ' ' '\n' < target/release/spotify_player.d | grep "^$GITHUB_WORKSPACE/"
          | xargs realpath -m --relative-to="$GITHUB_WORKSPACE" | grep -v '^target/' | sort -u
          > target/release/session-sources.txt

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: spotify_player-linux
          path: |
            target/release/spotify_player
            target/release/session-sources.txt
          if-no-files-found: error

  # The release is the master commit's `git describe`, e.g. v0.25.1-102-gabcdef1; release
  # tags are excluded from the describe so the next one counts from upstream's tag.
  # PRs also assemble and validate the release, without publishing it.
  release:
    needs: [rust-ci-windows, windows-build, linux-build]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -Command "$ErrorActionPreference = 'Stop'; . ([scriptblock]::Create([IO.File]::ReadAllText('{0}'))); if (Test-Path variable:LASTEXITCODE) { exit $LASTEXITCODE }"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: spotify_player-windows
          path: dist

      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: spotify_player-linux
          path: dist

      - name: Validate release assets
        run: |
          foreach ($name in 'spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt') {
            if (-not (Get-Item "dist/$name").Length) { throw "empty release asset: $name" }
          }
          foreach ($name in 'spotify_player.exe', 'fzt.dll') {
            $sig = Get-AuthenticodeSignature "dist/$name"
            if ($sig.Status -ne 'Valid') { throw "invalid signature on $name`: $($sig.Status)" }
          }
          $sources = @(Get-Content dist/session-sources.txt)
          if ('spotify_player/src/main.rs' -notin $sources) { throw 'session source list omits main.rs' }
          foreach ($source in $sources) {
            if ($source.StartsWith('/') -or $source.Contains('..') -or -not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "invalid session source: $source"
            }
          }
          git describe --tags --always --abbrev=7 --exclude '*-g*'

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = git describe --tags --always --abbrev=7 --exclude '*-g*'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "token $env:TOKEN" }
          $release = Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 200 -and -not $release.draft) {
            $missing = @('spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt' | Where-Object { $_ -notin $release.assets.name })
            if ($missing.Count) { throw "published release $tag is incomplete" }
            Write-Host "$tag already released"
            exit 0
          }
          if ($code -eq 404) {
            $body = @{ tag_name = $tag; target_commitish = $env:GITHUB_SHA; name = $tag; body = "Built from $env:GITHUB_SHA."; draft = $true } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post "$api/releases" -Headers $headers -ContentType 'application/json' -Body $body
          } elseif ($code -ne 200) { throw "release lookup for $tag returned $code" }
          foreach ($name in 'spotify_player.exe', 'fzt.dll', 'spotify_player', 'session-sources.txt') {
            if ($name -notin $release.assets.name) {
              Invoke-RestMethod -Method Post "$api/releases/$($release.id)/assets?name=$name" -Headers $headers -Form @{ attachment = Get-Item "dist/$name" } | Out-Null
            }
          }
          Invoke-RestMethod -Method Patch "$api/releases/$($release.id)" -Headers $headers -ContentType 'application/json' -Body '{"draft":false}' | Out-Null
          Write-Host "released $tag ($($release.id)) at $env:GITHUB_SHA"
