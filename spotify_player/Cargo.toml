[package]
name = "spotify_player"
version = "0.25.1"
authors = ["Thang Pham <phamducthang1234@gmail.com>"]
edition = "2021"
license = "MIT"
description = "A Spotify player in the terminal with full feature parity"
repository = "https://github.com/aome510/spotify-player"
keywords = ["spotify", "tui", "ratatui", "player"]
readme = "../README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "string"] }
config_parser2 = "0.1.7"
crossterm = "0.29.0"
dirs-next = "2.0.0"
gethostname = { version = "1.1.0", optional = true }
libloading = "0.8.9"
librespot-connect = { version = "0.8.0", optional = true }
librespot-core = { version = "0.8.0" }
librespot-playback = {version = "0.8.0", optional = true, default-features = false, features = ["native-tls"]}
librespot-metadata = { version = "0.8.0" }
librespot-protocol = { version = "0.8.0", optional = true }
cpal = { version = "0.16.0", optional = true }
log = "0.4.34"
chrono = "0.4.45"
chrono-humanize = "0.2.3"
reqwest = { version = "0.12.28", default-features = false, features = ["charset", "http2", "system-proxy", "json", "blocking"] }
reqwest-middleware = "0.4.2"
rspotify = {version = "0.16.1", features = ["cli", "reqwest-middleware"] }
http = "1.5.0"
base64 = "0.23.1"
sha2 = "0.11.0"
open = "5.4.3"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = [
	"rt",
	"rt-multi-thread",
	"io-util",
	"macros",
	"net",
	"sync",
	"test-util",
	"time",
] }
toml = "1.1.5"
ratatui = { version = "0.30.2", features = ["serde"] }
protobuf = { version = "3.7.2", optional = true }
rand = "0.10.2"
maybe-async = "0.2.11"
async-trait = "0.1.92"
parking_lot = "0.12.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
backtrace = "0.3.76"
souvlaki = { version = "0.8.3", optional = true }
image = { version = "0.25.10", optional = true }
notify-rust = { version = "4.18.0", optional = true, default-features = false, features = [
	"d",
] }
flume = "0.12.0"
serde_json = "1.0.151"
regex = "1.13.1"
rustfft = { version = "6", optional = true }
ttl_cache = "0.5.1"
clap_complete = "4.6.9"
which = "8.0.6"
fuzzy-matcher = { version = "0.3.7", optional = true }
html-escape = "0.2.15"
rustls = { version = "0.23.44", default-features = false, features = ["ring"] }
unicode-bidi = "0.3.18"
futures = "0.3.34"
# fix for https://github.com/aome510/spotify-player/issues/914
vergen = "=9.0.6"
ratatui-image = { version = "11.0.8", optional = true, default-features = false, features = ["crossterm"] }
# the session's relay, the PCs' way to Spotify (`relay`)
hyper = { version = "1.11.1", optional = true, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", optional = true, features = ["tokio"] }
http-body-util = { version = "0.1.5", optional = true }

[dev-dependencies]
wiremock = "0.6.5"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.winit]
version = "0.30.13"
optional = true

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.1"
# the `implement` macro on `windows` interfaces expands to paths in `windows_core`
windows-core = { version = "0.58.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58.0"
features = [
	"implement",
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_Media_Audio",
	"Win32_System_Com",
	"Win32_System_LibraryLoader",
	"Win32_UI_Shell_PropertiesSystem",
	"Win32_UI_WindowsAndMessaging",
]
optional = true

[features]
# the home cast's session (`spotify_player session`): the player, its audio on stdout for Snapcast
streaming = ["librespot-playback", "librespot-connect", "librespot-protocol", "protobuf", "dep:hyper", "dep:hyper-util", "dep:http-body-util"]
# the terminal UI: pages, popups, keys and the command palette. The session has no screen, so
# its build leaves this out.
tui = []
# a PC attached to the session: plays its audio from Snapcast and draws the visualization
cast = ["tui", "dep:cpal", "rustfft", "dep:gethostname", "windows", "dep:windows-core"]
media-control = ["souvlaki", "winit", "windows"]
image = ["tui", "ratatui-image", "dep:image"]
ascii-cover = ["cast", "dep:image"]
sixel = ["image"]
pixelate = ["image"]
notify = ["notify-rust"]
fzf = ["fuzzy-matcher"]

# TLS backend used by the application's HTTP client (auth/token exchange).
# `rustls-tls` keeps reqwest's default backend (rustls + rustls-platform-verifier).
# `native-tls` uses the system TLS library (e.g. openssl) instead — needed on
# platforms where rustls-platform-verifier cannot run, such as Termux (Android
# target without a JVM, see rustls/rustls-platform-verifier#219).
rustls-tls = ["reqwest/default-tls"]
native-tls = ["reqwest/native-tls"]

default = ["cast", "media-control", "rustls-tls", "ascii-cover"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["async-trait", "vergen"]
