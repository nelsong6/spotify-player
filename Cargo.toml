[workspace]
members = ["spotify_player", "spotify_player_session"]
# a plain `cargo build` is the client; `-p spotify_player_session` builds the session. Built
# together, Cargo would give the client the session's features.
default-members = ["spotify_player"]
resolver = "2"
exclude = ["vendor"]

# The release ships the session for the cluster and the client for the PCs.
[workspace.metadata.pipeline-templates.targets.x86_64-unknown-linux-gnu]
package = "spotify_player_session"

[workspace.metadata.pipeline-templates.targets.x86_64-pc-windows-msvc]
package = "spotify_player"

# librespot-connect 0.8.0 with the fix for Web API plays of a song list, which Spotify now sends
# under a placeholder context uri that 0.8.0 tries to resolve, failing the play (SPT-41;
# librespot-org/librespot#1870). Drop it once a librespot release has the fix.
[patch.crates-io]
librespot-connect = { path = "vendor/librespot-connect" }

[profile.release]
debug = 1

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = 1 }
perf = { level = "warn", priority = 2 }
style = { level = "warn", priority = 3 }
complexity = { level = "warn", priority = 4 }

module_name_repetitions = { level = "allow", priority = 20 }
cast_possible_truncation = { level = "allow", priority = 20 }
cast_sign_loss = { level = "allow", priority = 20 }
cast_possible_wrap = { level = "allow", priority = 20 }
cast_precision_loss = { level = "allow", priority = 20 }
missing_errors_doc = { level = "allow", priority = 20 }
similar_names = { level = "allow", priority = 20 }
too_many_lines = { level = "allow", priority = 20 }
