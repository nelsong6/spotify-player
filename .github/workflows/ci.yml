name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: master

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_FEATURES: "streaming,cast,media-control,image,notify,fzf"

jobs:
  rust-ci:
    if: github.event.pull_request.draft != true

    strategy:
      matrix:
        os: [macOS-latest, windows-latest, ubuntu-latest]
        toolchain: [stable]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install libssl-dev libasound2-dev libdbus-1-dev libxcb-shape0-dev libxcb-xfixes0-dev
        if: ${{ runner.os == 'Linux' }}

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        id: install_toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache cargo deps and build
        uses: Swatinem/rust-cache@v2

      - name: Cargo format
        run: cargo fmt --all -- --check

      - name: Cargo test
        run: cargo test --no-default-features --features ${{ env.RUST_FEATURES }}

      - name: Cargo clippy with all features
        run: cargo clippy --no-default-features --features ${{ env.RUST_FEATURES }} -- -D warnings

      - name: Cargo clippy without features
        run: cargo clippy --no-default-features -- -D warnings

  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Machete
        uses: bnjbvr/cargo-machete@main

  typos:
    # https://github.com/crate-ci/typos
    # install and run locally: cargo install typos-cli && typos
    name: typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v4

      - name: Check spelling of entire workspace
        uses: crate-ci/typos@master

  windows-build:
    # the build publish.ps1 publishes, made alongside the checks; publish.ps1 takes it only
    # from a run whose checks all passed
    if: github.event.pull_request.draft != true
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo deps and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release

      - name: Fetch fzt
        # the command palette loads fzt.dll from beside the executable; fzt.lock pins its release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # a Windows checkout gives fzt.lock CRLF line endings
          read -r tag sha256 < <(tr -d '\r' < fzt.lock)
          gh release download "$tag" -R romaine-life/fzt-terminal -p fzt-windows-amd64.dll -O target/release/fzt.dll
          echo "$sha256  target/release/fzt.dll" | sha256sum -c -

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spotify_player-windows
          path: |
            target/release/spotify_player.exe
            target/release/fzt.dll
          if-no-files-found: error

  linux-build:
    # `spotify_player keep` and the session for the NAS: the session's audio goes to stdout, so
    # no audio libraries to build against
    if: github.event.pull_request.draft != true
    # its glibc must not outrun the NAS container's Debian stable
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo deps and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --release --no-default-features --features rustls-tls,streaming

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spotify_player-linux
          path: target/release/spotify_player
          if-no-files-found: error
